<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Withdrawal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Withdrawal Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💶</text></svg>">
<style>
:root{--bg:#0f1117;--card:#181b24;--line:#262a36;--txt:#f2f4f8;--mut:#8b93a7;--ok:#34d399;--warn:#fbbf24;--over:#ff2d78;--acc:#6c8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pos{color:var(--ok)}.neg{color:var(--over)}

.hero{text-align:center;padding:16px 16px 20px;transition:box-shadow .3s,border-color .3s}
.hero .wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hero .wk button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:22px}
.hero .wk button:disabled{opacity:.25;cursor:default}
.hero .wk div{display:flex;flex-direction:column;gap:2px}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.sub{color:var(--mut);margin-bottom:16px}
.bar{height:16px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.barlbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px}
.tip{margin-top:12px;font-size:14px;color:var(--mut)}
.hero.ok .big{color:var(--ok)}.hero.ok .bar i{background:var(--ok)}
.hero.warn .big{color:var(--warn)}.hero.warn .bar i{background:var(--warn)}
.hero.over{border-color:var(--over);box-shadow:0 0 0 1px var(--over),0 0 34px rgba(255,45,120,.35)}
.hero.over .big{color:var(--over)}
.hero.over .bar i{background:linear-gradient(90deg,#ff2d78,#ff7a18);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.7}}
.gbig{text-align:center}
.gbig .big{font-size:44px}

.rts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rt{padding:12px 4px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}
.rt.on.ok{border-color:var(--ok);background:rgba(52,211,153,.15)}
.rt.on.par{border-color:var(--warn);background:rgba(251,191,36,.15)}
.rt.on.no{border-color:var(--over);background:rgba(255,45,120,.15)}

.hist{display:flex;align-items:flex-end;gap:6px;height:100px;position:relative;border-bottom:1px solid var(--line)}
.hist:after{content:"";position:absolute;left:0;right:0;bottom:66.67%;border-top:1px dashed var(--mut);opacity:.5;pointer-events:none}
.hcol{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:6px}
.hcol.sel{background:rgba(255,255,255,.07)}
.hb{display:block;width:100%;border-radius:6px 6px 0 0;min-height:3px}
.hb.ok{background:var(--ok)}.hb.warn{background:var(--warn)}.hb.over{background:var(--over)}
.hlbl{display:flex;gap:6px;margin-top:6px}
.hlbl span{flex:1;text-align:center;font-size:10px;color:var(--mut);line-height:1.5}

.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{font-size:12px}
.am{font-weight:700;white-space:nowrap}
.am.ingreso{color:var(--ok)}
.am.traspaso{color:var(--mut)}
.dh{font-size:12px;color:var(--mut);text-transform:capitalize;margin:14px 0 2px}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:22px}
.mnav b{text-transform:capitalize}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.trio div{display:flex;flex-direction:column;gap:4px}
.trio b{font-size:16px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv.tot{font-weight:700}
.kv.mut{color:var(--mut)}
.mini{height:6px;border-radius:99px;background:var(--bg);margin:6px 0 12px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc);border-radius:99px}

.inp{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-size:16px;width:100%;font-family:inherit}
.inp:focus{outline:2px solid var(--acc);border-color:transparent}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
label:first-child{margin-top:0}
.accw{margin-bottom:14px}
.acc{display:flex;gap:8px;margin-bottom:6px}
.acc .num{max-width:130px;text-align:right}
.acc button{width:40px;color:var(--mut);font-size:18px}
.acc .sal{width:auto;min-width:112px;padding:0 10px;color:var(--txt);font-size:15px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:12px;text-align:right}
.acc2{display:flex;gap:8px}
.acc2 .dia{max-width:84px}
.accw select.inp{padding:8px 12px;font-size:14px;color:var(--mut)}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-top:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.danger{color:var(--over)}
.note{font-size:13px;color:var(--mut);line-height:1.5}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,23,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px}
nav button span{font-size:20px}
nav button.on{color:var(--txt)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 24px rgba(108,140,255,.45);z-index:11}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet.hidden{display:none}
.panel{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.panel .btn{margin-top:0}
.panel small.lb{display:block;margin-bottom:4px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:9px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
#f_imp{font-size:34px;font-weight:700;text-align:center}
#scan_st{font-size:13px;color:var(--mut);margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt);margin:0}
.chk input{width:20px;height:20px}
.acts{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="view"></div>
<button class="fab" data-act="add" aria-label="Añadir">+</button>
<nav>
  <button data-act="tab" data-t="week"><span>📊</span>Semana</button>
  <button data-act="tab" data-t="movs"><span>🧾</span>Movs</button>
  <button data-act="tab" data-t="gen"><span>📈</span>General</button>
  <button data-act="tab" data-t="cuentas"><span>🏦</span>Cuentas</button>
  <button data-act="tab" data-t="ajustes"><span>⚙️</span>Ajustes</button>
</nav>

<div id="sheet" class="sheet hidden">
  <div class="panel">
    <button class="btn" data-act="scan">📷 Escanear ticket o captura</button>
    <div id="scan_st"></div>
    <div class="seg">
      <button data-act="tipo" data-t="gasto">Gasto</button>
      <button data-act="tipo" data-t="ingreso">Ingreso</button>
      <button data-act="tipo" data-t="traspaso">Traspaso</button>
    </div>
    <input id="f_imp" class="inp" inputmode="decimal" placeholder="0,00 €" autocomplete="off">
    <div id="f_cats" class="chips"></div>
    <div><small class="lb" id="lbl_cta">Cuenta</small><select id="f_cuenta" class="inp"></select></div>
    <div id="f_dest_wrap" style="display:none"><small class="lb">Hacia</small><select id="f_destino" class="inp"></select></div>
    <input id="f_fecha" class="inp" type="date">
    <input id="f_nota" class="inp" type="text" placeholder="Nota (opcional)" autocomplete="off">
    <label class="chk" id="f_nb_wrap"><input type="checkbox" id="f_nobarra"> No contar en la barra semanal</label>
    <div class="acts">
      <button id="btnDel" class="btn danger" data-act="del" style="display:none">Eliminar</button>
      <button class="btn pri" data-act="saveMov">Guardar</button>
    </div>
  </div>
</div>
<input type="file" id="imp_file" accept="application/json" hidden>
<input type="file" id="scan_file" accept="image/*" hidden>
<div id="toast"></div>

<script>
const CATS_G=[['🍽️','Dietas'],['⛽','Carburante'],['🚗','Transporte'],['🎉','Ocio'],['🛍️','Compras'],['🏠','Hogar'],['💊','Salud'],['📺','Suscripciones'],['✨','Otros']];
const CATS_I=[['💼','Nómina'],['📲','Bizum'],['🏦','Transferencia'],['↩️','Reembolso'],['✨','Otros']];
const DIAS=[[1,'Lunes'],[2,'Martes'],[3,'Miércoles'],[4,'Jueves'],[5,'Viernes'],[6,'Sábado'],[0,'Domingo']];
const ICONOS={ok:'✅',parcial:'🟡',no:'❌'};
const KEY='gastos_v1';

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
const dm=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const wdm=d=>d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const cmp=(x,y)=>y.fecha.localeCompare(x.fecha)||y.ts-x.ts;
const sum=(L,t)=>L.filter(m=>m.tipo===t).reduce((s,m)=>s+m.importe,0);
const tot=(L,f)=>L.reduce((s,x)=>s+(Number(x[f])||0),0);
function parseNum(s){
  s=String(s).replace(/\s/g,'');
  if(s.includes(',')) s=s.replace(/\.(?=.*,)/g,'').replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
let tt;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);}

/* ---------- datos ---------- */
const CUENTAS_BASE=[['principal','Principal','cuenta'],['bizum','Bizum','cuenta'],['ahorro','Ahorro','ahorro'],['efectivo','Efectivo','cuenta'],['trading','Trading','trading']];
function cuentasBase(){
  const f=ymd(today()),t=Date.now();
  return CUENTAS_BASE.map(([id,nombre,tipo])=>({id,nombre,tipo,saldo:0,baseFecha:f,baseTs:t}));
}
const defaults=()=>({v2:true,settings:{budget:200,payDay:5},movs:[],cuentas:cuentasBase(),retiros:{},fijos:[],omitidos:[]});
function normalize(r){
  const d=defaults();
  if(!r)return d;
  const s=Object.assign(d,r,{settings:Object.assign(d.settings,r.settings||{}),retiros:r.retiros||{},fijos:r.fijos||[],omitidos:r.omitidos||[],cuentas:r.cuentas||[]});
  const f=ymd(today()),t=Date.now();
  cuentasBase().forEach(b=>{
    const falta=!s.cuentas.some(c=>c.id===b.id);
    if(falta&&(b.id==='principal'||!r.v2))s.cuentas.push(b);
  });
  s.v2=true;
  s.cuentas.forEach(c=>{if(!c.baseFecha){c.baseFecha=f;c.baseTs=t;}if(!c.tipo)c.tipo='cuenta';if(typeof c.saldo!=='number')c.saldo=Number(c.saldo)||0;});
  s.movs.forEach(m=>{if(!m.cuenta)m.cuenta='principal';});
  s.fijos.forEach(x=>{if(!x.dia)x.dia=1;if(!x.cuenta)x.cuenta='principal';if(!x.desde)x.desde=f;});
  return s;
}
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&Array.isArray(r.movs))return normalize(r);
  }catch(e){}
  return defaults();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar');}}

/* ---------- cuentas y saldos ---------- */
const nomCta=id=>{const c=S.cuentas.find(x=>x.id===id);return c?c.nombre:'—';};
function saldoDe(c){
  const hoy=ymd(today());
  const bd=c.baseFecha||'0000-00-00',bt=c.baseTs||0;
  let s=Number(c.saldo)||0;
  S.movs.forEach(m=>{
    if(m.fecha>hoy)return;
    if(!((m.ts>bt&&m.fecha>=bd)||m.fecha>bd))return;
    if(m.tipo==='gasto'&&m.cuenta===c.id)s-=m.importe;
    else if(m.tipo==='ingreso'&&m.cuenta===c.id)s+=m.importe;
    else if(m.tipo==='traspaso'){
      if(m.cuenta===c.id)s-=m.importe;
      if(m.destino===c.id)s+=m.importe;
    }
  });
  return s;
}
const sumSaldos=L=>L.reduce((s,c)=>s+saldoDe(c),0);

/* ---------- gastos fijos automáticos ---------- */
function aplicarFijos(){
  const t=today(),hoy=ymd(t);
  let cambios=false;
  S.fijos.forEach(f=>{
    const imp=Number(f.importe)||0;
    if(imp<=0)return;
    const d0=parse(f.desde||hoy);
    let y=d0.getFullYear(),mo=d0.getMonth();
    while(y<t.getFullYear()||(y===t.getFullYear()&&mo<=t.getMonth())){
      const dia=Math.min(Number(f.dia)||1,new Date(y,mo+1,0).getDate());
      const fecha=y+'-'+pad(mo+1)+'-'+pad(dia);
      const clave=f.id+'|'+y+'-'+pad(mo+1);
      if(fecha<=hoy&&!S.omitidos.includes(clave)&&!S.movs.some(m=>m.fijoKey===clave)){
        S.movs.push({id:uid(),ts:Date.now(),tipo:'gasto',importe:imp,cat:'Fijo',nota:f.nombre,fecha,cuenta:f.cuenta||'principal',noBarra:true,fijoId:f.id,fijoKey:clave});
        cambios=true;
      }
      mo++;if(mo>11){mo=0;y++;}
    }
  });
  if(cambios)save();
}

/* ---------- semanas (domingo a viernes; el sábado cuenta para la semana siguiente) ---------- */
function weekRange(off){
  const t=today();
  const diff=(S.settings.payDay-t.getDay()+7)%7;
  const end=addDays(t,diff+off*7);
  return {start:addDays(end,-5),from:addDays(end,-6),end,daysLeft:diff+1};
}
function weekSpent(r){
  const a=ymd(r.from),b=ymd(r.end);
  return S.movs.filter(m=>m.tipo==='gasto'&&!m.noBarra&&m.fecha>=a&&m.fecha<=b).reduce((s,m)=>s+m.importe,0);
}
function offFor(fecha){
  const d=parse(fecha);
  const diff=(S.settings.payDay-d.getDay()+7)%7;
  const end=addDays(d,diff);
  return Math.round((end-weekRange(0).end)/864e5/7);
}
function margin(){
  const g=S.movs.filter(m=>m.tipo==='gasto'&&!m.noBarra);
  if(!g.length)return null;
  const first=g.map(m=>m.fecha).sort()[0];
  const B=Number(S.settings.budget)||0;
  let t=0,n=0,ok=0;
  for(let k=-1;k>-300;k--){
    const r=weekRange(k);
    if(ymd(r.end)<first)break;
    const m=B-weekSpent(r);
    t+=m;n++;if(m>=0)ok++;
  }
  return n?{tot:t,n,ok}:null;
}

/* ---------- retiros (siempre a la cuenta Principal) ---------- */
function setRetiro(estado){
  const k=ymd(weekRange(UI.off).end);
  const cur=S.retiros[k];
  const B=Number(S.settings.budget)||0;
  const quitar=()=>{S.movs=S.movs.filter(m=>m.retiroKey!==k);};
  if(cur&&cur.estado===estado){delete S.retiros[k];quitar();save();render();return;}
  let imp;
  if(estado==='ok')imp=B;
  else if(estado==='no')imp=0;
  else{
    const def=cur&&cur.estado==='parcial'?String(cur.importe).replace('.',','):'';
    const v=parseNum(prompt('¿Cuánto has retirado? (€)',def));
    if(v===null)return;
    if(v<=0){toast('Para 0 € usa «No»');return;}
    if(v>=B){toast('Para el importe completo usa «Cumplido»');return;}
    imp=Math.round(v*100)/100;
  }
  S.retiros[k]={estado,importe:imp};
  quitar();
  if(imp>0){
    const hoy=ymd(today());
    S.movs.push({id:uid(),ts:Date.now(),tipo:'ingreso',importe:imp,cat:'Retiro',nota:'Retiro Capital.com',fecha:k<=hoy?k:hoy,cuenta:'principal',retiroKey:k});
  }
  save();render();
}
function retStats(){
  const v=Object.values(S.retiros||{});
  return {n:v.length,ok:v.filter(x=>x.estado==='ok').length,par:v.filter(x=>x.estado==='parcial').length,no:v.filter(x=>x.estado==='no').length,tot:v.reduce((s,x)=>s+(Number(x.importe)||0),0)};
}

/* ---------- estado de UI ---------- */
const now=new Date();
let UI={tab:'week',off:0,mo:now.getMonth(),yr:now.getFullYear()};
let SH={id:null,tipo:'gasto',cat:'Otros',cuenta:'principal',destino:'ahorro'};

function iconFor(m){
  if(m.tipo==='traspaso')return '🔁';
  if(m.cat==='Retiro')return '🏧';
  if(m.cat==='Fijo')return '📌';
  const c=(m.tipo==='gasto'?CATS_G:CATS_I).find(x=>x[1]===m.cat);
  return c?c[0]:'•';
}
function itemHTML(m){
  const sub=m.tipo==='traspaso'?`${esc(nomCta(m.cuenta))} → ${esc(nomCta(m.destino))}`:`${esc(m.cat)} · ${esc(nomCta(m.cuenta))}`;
  const extra=m.noBarra&&!m.fijoId?' · fuera de la barra':'';
  const sign=m.tipo==='gasto'?'−':m.tipo==='ingreso'?'+':'';
  return `<button class="it" data-act="edit" data-id="${m.id}">
    <span class="ic">${iconFor(m)}</span>
    <span class="tx"><b>${esc(m.nota||m.cat)}</b><small>${sub} · ${wdm(parse(m.fecha))}${extra}</small></span>
    <span class="am ${m.tipo}">${sign}${eur(m.importe)}</span>
  </button>`;
}

/* ---------- lector de tickets (OCR gratuito en el navegador) ---------- */
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
function mk(y,mo,d){
  if(y<100)y+=2000;
  if(y<2020||y>2100||mo<1||mo>12||d<1||d>31)return null;
  const t=new Date(y,mo-1,d);
  if(t.getMonth()!==mo-1)return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
function parseAmounts(s){
  s=s.replace(/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/g,' ');
  const out=[];
  (s.match(/\d{1,3}(?:\.\d{3})+,\d{2}|\d+,\d{2}(?!\d)|\d+\.\d{2}(?!\d)/g)||[]).forEach(x=>{
    const n=x.includes(',')?parseFloat(x.replace(/\./g,'').replace(',','.')):parseFloat(x);
    if(n>0&&n<20000)out.push(n);
  });
  return out;
}
function parseTicket(text){
  const raw=text||'';
  const low=raw.toLowerCase();
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);

  let cand=[];
  lines.forEach((l,i)=>{
    const ll=l.toLowerCase();
    if(/total|a pagar|importe|pagado|cobrado/.test(ll)&&!/subtotal|sub-total|iva|base|cambio|entregado|dto|descuento|ahorro/.test(ll)){
      let a=parseAmounts(l);
      if(!a.length)a=parseAmounts(lines[i+1]||'');
      cand=cand.concat(a);
    }
  });
  let importe=cand.length?Math.max(...cand):null;
  if(importe===null){
    const all=[].concat(...lines.map(parseAmounts));
    if(all.length)importe=Math.max(...all);
  }

  let fecha=null,m=raw.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)fecha=mk(+m[1],+m[2],+m[3]);
  if(!fecha){m=raw.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/);if(m)fecha=mk(+m[3],+m[2],+m[1]);}
  if(!fecha){m=low.match(/(\d{1,2})\s+(?:de\s+)?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-z]*\.?\s+(?:de\s+)?(\d{4})/);if(m)fecha=mk(+m[3],MESES[m[2]],+m[1]);}

  let tipo='gasto',cat='Otros';
  if(/has recibido|te han enviado|bizum recibido|abono|n[oó]mina|devoluci[oó]n/.test(low)){
    tipo='ingreso';
    cat=/n[oó]mina/.test(low)?'Nómina':/bizum/.test(low)?'Bizum':/devoluci/.test(low)?'Reembolso':'Transferencia';
  }else if(/repsol|cepsa|moeve|\bbp\b|shell|galp|gasolinera|gasoil|diesel|diésel|carburante|gasolina|ballenoil|plenoil|petroprix|avia/.test(low)){cat='Carburante';}
  else if(/restaurante|cafeter|mercadona|carrefour|lidl|aldi|consum|bonpreu|caprabo|condis|eroski|supermerc|panader|pizz|burger|mcdonald|kebab|men[uú]|bocata|sushi|cervecer|taberna|\bbar\b/.test(low)){cat='Dietas';}
  else if(/renfe|rodalies|\btmb\b|taxi|uber|cabify|bolt|parking|aparcamiento|peaje|autopista|abertis|via-t/.test(low)){cat='Transporte';}
  else if(/farmacia|cl[ií]nica|dentista|[oó]ptica|medic/.test(low)){cat='Salud';}
  else if(/netflix|spotify|hbo|disney|prime video|google play|suscrip/.test(low)){cat='Suscripciones';}
  else if(/ikea|leroy|bricomart|brico|ferreter|endesa|iberdrola|naturgy/.test(low)){cat='Hogar';}
  else if(/amazon|zara|decathlon|mediamarkt|fnac|el corte|h&m/.test(low)){cat='Compras';}
  else if(/cine|teatro|concert|bolera|discoteca/.test(low)){cat='Ocio';}

  const first=lines.find(l=>/[a-záéíóúñ]{3,}/i.test(l));
  return {importe,fecha,tipo,cat,nota:first?first.slice(0,40):''};
}
let tessP=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  if(!tessP)tessP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=res;
    s.onerror=()=>{tessP=null;rej(new Error('cdn'));};
    document.head.appendChild(s);
  });
  return tessP;
}
function toCanvas(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,1800/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const g=c.getContext('2d');
      g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
      g.filter='grayscale(1) contrast(1.3)';
      g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
async function scanFile(file){
  if(!file)return;
  const st=$('#scan_st');
  st.textContent='Cargando lector…';
  try{
    await loadTess();
    const cv=await toCanvas(file);
    const w=await Tesseract.createWorker('spa',1,{logger:m=>{
      if(m.status==='recognizing text')st.textContent='Leyendo… '+Math.round(m.progress*100)+' %';
    }});
    const out=await w.recognize(cv);
    await w.terminate();
    applyScan(parseTicket(out.data.text));
  }catch(e){
    st.textContent='No se pudo leer la imagen. Rellénalo a mano.';
  }
}
function applyScan(r){
  SH.tipo=r.tipo;SH.cat=r.cat;
  if(r.importe)$('#f_imp').value=String(r.importe).replace('.',',');
  if(r.fecha)$('#f_fecha').value=r.fecha;
  if(r.nota&&!$('#f_nota').value)$('#f_nota').value=r.nota;
  drawSheet();
  $('#scan_st').textContent=r.importe?'Listo. Revisa los datos antes de guardar.':'No encontré el importe; ponlo a mano.';
}

/* ---------- copia de seguridad ---------- */
function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='gastos-backup-'+ymd(today())+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.movs))throw 0;
      if(!confirm('Esto reemplazará los datos actuales. ¿Continuar?'))return;
      S=normalize(d);
      save();aplicarFijos();render();toast('Datos importados');
    }catch(e){toast('Archivo no válido');}
  };
  r.readAsText(f);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return;}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  switch(el.dataset.act){
    case 'tab':UI.tab=el.dataset.t;render();window.scrollTo(0,0);break;
    case 'add':openSheet();break;
    case 'traspaso':openSheet(null,'traspaso');break;
    case 'edit':{
      const m=S.movs.find(x=>x.id===el.dataset.id);
      if(m&&m.retiroKey){toast('El retiro se gestiona en la pestaña Semana');break;}
      openSheet(el.dataset.id);break;
    }
    case 'scan':$('#scan_file').click();break;
    case 'wprev':UI.off--;render();break;
    case 'wnext':if(UI.off<0){UI.off++;render();}break;
    case 'goto':UI.off=Number(el.dataset.off);render();break;
    case 'ret':setRetiro(el.dataset.s);break;
    case 'mprev':UI.mo--;if(UI.mo<0){UI.mo=11;UI.yr--;}render();break;
    case 'mnext':UI.mo++;if(UI.mo>11){UI.mo=0;UI.yr++;}render();break;
    case 'tipo':
      SH.tipo=el.dataset.t;
      SH.cat=SH.tipo==='traspaso'?'Traspaso':'Otros';
      if(SH.cuenta===SH.destino)SH.destino=otraCta(SH.cuenta);
      drawSheet();break;
    case 'chip':SH.cat=el.dataset.c;drawSheet();break;
    case 'saveMov':saveMov();break;
    case 'del':delMov();break;
    case 'ajustar':{
      const c=S.cuentas.find(x=>x.id===el.dataset.id);
      if(!c)break;
      const v=parseNum(prompt('Saldo real actual de «'+c.nombre+'» (€)',String(Math.round(saldoDe(c)*100)/100).replace('.',',')));
      if(v===null)break;
      c.saldo=Math.round(v*100)/100;c.baseFecha=ymd(today());c.baseTs=Date.now();
      save();render();toast('Saldo ajustado');break;
    }
    case 'addacc':S.cuentas.push({id:uid(),nombre:'Nueva cuenta',tipo:'cuenta',saldo:0,baseFecha:ymd(today()),baseTs:Date.now()});save();render();break;
    case 'delacc':{
      const id=el.dataset.id;
      if(id==='principal')break;
      if(S.movs.some(m=>m.cuenta===id||m.destino===id)){toast('Tiene movimientos; no se puede eliminar');break;}
      if(confirm('¿Eliminar esta cuenta?')){S.cuentas=S.cuentas.filter(c=>c.id!==id);save();render();}
      break;
    }
    case 'addfijo':
      S.fijos.push({id:uid(),nombre:'Nuevo gasto fijo',importe:0,dia:1,cuenta:'principal',desde:ymd(today())});
      save();render();break;
    case 'delfijo':
      if(confirm('¿Eliminar este gasto fijo? Los cargos ya hechos se mantienen.')){S.fijos=S.fijos.filter(f=>f.id!==el.dataset.id);save();render();}
      break;
    case 'export':exportData();break;
    case 'import':$('#imp_file').click();break;
    case 'reset':
      if(confirm('¿Borrar TODOS los datos de este dispositivo?')){S=defaults();save();render();toast('Datos borrados');}
      break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f_cuenta'){SH.cuenta=t.value;}
  else if(t.id==='f_destino'){SH.destino=t.value;}
  else if(t.id==='s_budget'){
    const v=parseNum(t.value);
    if(v&&v>0){S.settings.budget=v;save();render();toast('Guardado');}
  }else if(t.id==='s_day'){
    S.settings.payDay=Number(t.value);save();render();toast('Guardado');
  }else if(t.dataset.cid){
    const c=S.cuentas.find(x=>x.id===t.dataset.cid);
    if(c){
      if(t.dataset.f==='nombre')c.nombre=t.value.trim()||'Cuenta';
      else if(t.dataset.f==='tipo')c.tipo=t.value;
      save();render();
    }
  }else if(t.dataset.fid){
    const f=S.fijos.find(x=>x.id===t.dataset.fid);
    if(f){
      if(t.dataset.f==='nombre')f.nombre=t.value.trim()||'Gasto fijo';
      else if(t.dataset.f==='importe')f.importe=parseNum(t.value)||0;
      else if(t.dataset.f==='dia')f.dia=Math.min(31,Math.max(1,parseInt(t.value,10)||1));
      else if(t.dataset.f==='cuenta')f.cuenta=t.value;
      save();aplicarFijos();render();
    }
  }else if(t.id==='imp_file'){
    importFile(t.files[0]);t.value='';
  }else if(t.id==='scan_file'){
    scanFile(t.files[0]);t.value='';
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){aplicarFijos();render();}});

aplicarFijos();
render();
</script>
